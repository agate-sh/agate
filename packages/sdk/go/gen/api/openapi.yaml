        sessions:
        - tmuxName: tmuxName
          createdAt: createdAt
          repoName: repoName
          worktreeKey: worktreeKey
          agentName: claude
          lastAccessed: lastAccessed
          id: id
          worktreePath: worktreePath
          branch: branch
        - tmuxName: tmuxName
