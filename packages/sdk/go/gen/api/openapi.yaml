openapi: 3.1.0
info:
  description: Agate terminal multiplexer API - auto-generated from route definitions
  title: Agate Server API
  version: 1.0.0
servers:
- url: /
paths:
  /health:
    get:
      description: Health check endpoint
      operationId: health.check
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/health_check_200_response"
          description: Server is healthy
  /git/repo-info:
    get:
      description: Get repository information from a given path
      operationId: git.repoInfo
      parameters:
      - explode: true
        in: query
        name: dir
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_200_response"
          description: Repository information
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Internal server error
  /git/status:
    get:
      description: Get detailed file status with add/del counts
      operationId: git.status
      parameters:
      - explode: true
        in: query
        name: repoPath
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_status_200_response"
          description: Git file status
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Internal server error
  /git/head:
    get:
      description: Get current branch (HEAD)
      operationId: git.head
      parameters:
      - explode: true
        in: query
        name: repoPath
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_head_200_response"
          description: Current branch name
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Internal server error
  /git/worktrees:
    get:
      description: List all worktrees for repository
      operationId: git.worktrees.list
      parameters:
      - explode: true
        in: query
        name: repoPath
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_worktrees_list_200_response"
          description: List of worktrees
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Internal server error
  /git/worktree:
    delete:
      description: Delete worktree and branch
      operationId: git.worktree.delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/git_worktree_delete_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_worktree_delete_200_response"
          description: Worktree deleted successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Internal server error
    post:
      description: Create worktree with optional COW
      operationId: git.worktree.create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/git_worktree_create_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_worktree_create_200_response"
          description: Worktree created successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Internal server error
  /git/stage:
    post:
      description: Stage file(s)
      operationId: git.stage
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/git_stage_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_worktree_delete_200_response"
          description: File staged successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Internal server error
  /git/stage-all:
    post:
      description: Stage all files
      operationId: git.stageAll
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/git_stageAll_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_worktree_delete_200_response"
          description: All files staged successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Internal server error
  /git/unstage:
    post:
      description: Unstage file(s)
      operationId: git.unstage
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/git_stage_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_worktree_delete_200_response"
          description: File unstaged successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Internal server error
  /git/commit:
    post:
      description: Commit all changes
      operationId: git.commit
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/git_commit_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_commit_200_response"
          description: Changes committed successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Internal server error
  /git/discard:
    post:
      description: Discard file changes
      operationId: git.discard
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/git_stage_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_worktree_delete_200_response"
          description: Changes discarded successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Internal server error
  /sessions:
    get:
      description: List persisted sessions
      operationId: session.list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/session_list_200_response"
          description: Sessions retrieved successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Internal server error
    post:
      description: Create a new tmux session with atomic worktree creation
      operationId: session.create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/session_create_request"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/session_create_201_response"
          description: Session created successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Internal server error
  /sessions/{id}:
    delete:
      description: Kill and delete session
      operationId: session.delete
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_worktree_delete_200_response"
          description: Session deleted successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Internal server error
    get:
      description: Get session information
      operationId: session.get
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/session_get_200_response"
          description: Session information
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Internal server error
  /sessions/{id}/resize:
    post:
      description: Resize session terminal
      operationId: session.resize
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/session_resize_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_worktree_delete_200_response"
          description: Terminal resized successfully
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/git_repoInfo_400_response"
          description: Internal server error
components:
  schemas:
    session_resize_request:
      properties:
        cols:
